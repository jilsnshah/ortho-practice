[project]
name = "ortho-backend"
version = "0.1.0"
description = "Orthodontist multi-clinic practice companion API"
authors = [
    { name = "jilsnshah", email = "jilsnshah@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.141.1",
    "itsdangerous>=2.2.0",
    "pillow>=12.3.0",
    "psycopg[binary]>=3.3.5",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0.54",
    "uvicorn[standard]>=0.53.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "openpyxl>=3.1.5",
    "pytest>=9.1.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
