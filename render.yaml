# Infrastructure for this app on Render, matching what the CLI created.
# Recreate with: Render dashboard -> Blueprints -> New Blueprint Instance.
services:
  - type: web
    name: ortho-practice
    runtime: docker
    plan: free
    region: singapore
    branch: main
    healthCheckPath: /api/health
    envVars:
      - key: ORTHO_DATABASE_URL
        fromDatabase:
          name: ortho-db
          property: connectionString
      - key: ORTHO_SECRET_KEY
        generateValue: true
      - key: ORTHO_COOKIE_SECURE
        value: true
      # First-run account only; set these by hand, then clear them.
      - key: ORTHO_BOOTSTRAP_EMAIL
        sync: false
      - key: ORTHO_BOOTSTRAP_PASSWORD
        sync: false

databases:
  - name: ortho-db
    plan: free
    region: singapore
    postgresMajorVersion: "18"
